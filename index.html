<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap');

:root{
  --ink:#15163A;
  --ink-soft:#2A2C5C;
  --paper:#FFFBF2;
  --paper-dim:#F4EFE2;
  --red:#FF4D5E;
  --red-dark:#E13347;
  --yellow:#FFCC33;
  --blue:#3E8EF7;
  --blue-dark:#2C6FD1;
  --green:#20C997;
  --shadow:rgba(21,22,58,0.18);
  --radius:18px;
}
[data-theme="dark"]{
  --ink:#E8E4DA;
  --ink-soft:#B0ADA4;
  --paper:#141420;
  --paper-dim:#1A1A2E;
  --red:#FF5E6E;
  --red-dark:#FF4D5E;
  --yellow:#FFD644;
  --blue:#5BA3F8;
  --blue-dark:#3E8EF7;
  --green:#2ED9A3;
  --shadow:rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
h1,h2,h3,.display{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  margin:0;
  line-height:1.05;
}
.mono{font-family:'Space Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
img,svg{display:block;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--blue);
  outline-offset:2px;
}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:999px;font-family:'Baloo 2',sans-serif;font-weight:700;
  font-size:16px;padding:13px 26px;transition:transform .15s ease, box-shadow .15s ease, background .2s;
  box-shadow:0 4px 0 rgba(0,0,0,0.15);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,0.15);}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red-dark);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-blue:hover{background:var(--blue-dark);}
.btn-yellow{background:var(--yellow);color:var(--ink);}
.btn-ink{background:var(--ink);color:var(--paper);}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--ink);}
.btn-ghost:active{transform:none;}
.btn-sm{padding:8px 16px;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,0.15);}
.btn[disabled]{background:#555;color:#999;box-shadow:none;cursor:not-allowed;}
.btn[disabled]:active{transform:none;}
.icon-btn{
  background:var(--paper);border:2px solid var(--ink); border-radius:50%;
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:none;transition:background .25s, border .25s;
}

header.site{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:3px solid var(--ink);transition:background .25s,border .25s;
}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:16px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-badge{
  width:46px;height:46px;border-radius:50%;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  border:3px solid var(--ink);transition:border .25s;
}
.logo-text{font-size:20px;color:var(--red-dark);letter-spacing:.2px;white-space:nowrap;}
nav.main-nav{display:flex;gap:6px;flex-wrap:wrap;}
.nav-link{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;padding:8px 14px;
  border-radius:999px;text-decoration:none;color:var(--ink);
}
.nav-link:hover{background:var(--paper-dim);}
.header-actions{display:flex;align-items:center;gap:6px;}
.theme-btn{
  background:var(--paper-dim);border:2px solid var(--ink);border-radius:50%;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .25s,border .25s;
}
.cart-btn{position:relative;}
.cart-count{
  position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--paper);
}
.account-menu{position:relative;}
.account-trigger{
  display:flex;align-items:center;gap:8px;background:var(--paper-dim);border:2px solid var(--ink);
  border-radius:999px;padding:7px 14px 7px 7px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
}
.avatar-dot{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.dropdown{
  position:absolute;right:0;top:calc(100% + 8px);background:var(--paper);border:3px solid var(--ink);
  border-radius:14px;min-width:200px;box-shadow:0 8px 0 rgba(0,0,0,0.1);overflow:hidden;z-index:50;
}
.dropdown button, .dropdown a{
  display:block;width:100%;text-align:left;background:none;border:none;padding:12px 16px;
  font-family:'Plus Jakarta Sans';font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);
}
.dropdown button:hover, .dropdown a:hover{background:var(--paper-dim);}
.dropdown hr{border:none;border-top:2px solid var(--paper-dim);margin:0;}

.hero{
  background:var(--ink);color:var(--paper);position:relative;overflow:hidden;
  padding:64px 24px 80px;
}
.confetti{position:absolute;border-radius:4px;opacity:.85;}
@media (prefers-reduced-motion: no-preference){
  .confetti{animation:float 6s ease-in-out infinite;}
}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-16px) rotate(12deg);}}
.hero-inner{position:relative;z-index:2;max-width:760px;margin:0 auto;text-align:center;}
.hero-tag{
  display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);
  font-family:'Space Mono',monospace;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;
  margin-bottom:22px;border:2px dashed var(--ink);
}
.hero h1{font-size:clamp(34px,5.5vw,58px);color:#fff;}
.hero h1 .hl{color:var(--yellow);}
.hero p.sub{font-size:18px;color:#D8D6F0;margin:18px auto 30px;max-width:520px;}
.hero-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

.catalog-section{padding:64px 24px;}
.section-head{text-align:center;max-width:560px;margin:0 auto 36px;}
.section-head h2{font-size:clamp(28px,4vw,38px);}
.section-head p{color:#5C5A78;margin-top:10px;font-size:16px;}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:40px;}
.chip{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border-radius:999px;
  border:2px solid var(--ink);background:var(--paper);
}
.chip.is-active{background:var(--ink);color:var(--paper);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px;}

.tag-card{
  position:relative;background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;
  padding:26px 20px 20px;display:flex;flex-direction:column;gap:10px;
  transition:transform .2s ease, background .25s;
}
.tag-card:hover{transform:rotate(0deg) translateY(-4px) !important;}
.tag-card::before{
  content:'';position:absolute;top:-11px;left:24px;width:20px;height:20px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--ink);
}
.tag-card.cat-red{background:color-mix(in srgb, var(--paper) 100%, var(--red) 6%);}
.tag-card.cat-blue{background:color-mix(in srgb, var(--paper) 100%, var(--blue) 6%);}
.tag-icon{font-size:46px;text-align:center;margin-top:6px;}
.tag-card h3{font-size:19px;}
.tag-desc{font-size:13.5px;color:var(--ink-soft);flex-grow:1;}
.tag-stock{font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;}
.tag-stock.low{color:var(--red-dark);}
.tag-stock.ok{color:#0F8A63;}
.tag-stock.none{color:#888;}
.tag-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;flex-wrap:wrap;gap:4px;}
.tag-price{font-family:'Space Mono',monospace;font-weight:700;font-size:21px;}
.tag-rating{font-size:13px;color:var(--yellow);}
.cat-pill{
  position:absolute;top:14px;right:14px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:999px;color:#fff;
}
.cat-pill.cat-red{background:var(--red);}
.cat-pill.cat-blue{background:var(--blue);}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'Baloo 2';font-size:18px;
  border:2.5px dashed #888;border-radius:18px;
}

/* CAROUSEL */
.carousel{position:relative;overflow:hidden;border-radius:10px;margin-top:6px;background:var(--paper-dim);}
.carousel-track{display:flex;transition:transform .3s ease;}
.carousel-slide{min-width:100%;}
.carousel-slide img{width:100%;height:132px;object-fit:cover;display:block;}
.carousel-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,0.5);color:#fff;border:none;
  width:26px;height:26px;border-radius:50%;font-size:13px;
  cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.carousel:hover .carousel-btn{opacity:1;}
.carousel-btn.prev{left:5px;}
.carousel-btn.next{right:5px;}
.carousel-dots{display:flex;justify-content:center;gap:5px;margin-top:5px;}
.carousel-dot{
  width:7px;height:7px;border-radius:50%;background:#bbb;
  border:none;cursor:pointer;padding:0;
}
.carousel-dot.active{background:var(--ink);}

/* TESTIMONIALS */
.testimonials-section{padding:50px 24px 70px;background:var(--paper-dim);transition:background .25s;}
.testimonials-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;margin-top:30px;}
.testimonial-card{
  background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:20px;
  display:flex;flex-direction:column;gap:8px;
}
.testimonial-card .t-head{display:flex;justify-content:space-between;align-items:center;}
.testimonial-card .t-name{font-weight:700;font-size:14px;}
.testimonial-card .t-date{font-size:11.5px;color:var(--ink-soft);}
.testimonial-card .t-text{font-size:14px;line-height:1.5;color:var(--ink-soft);}
.stars{color:var(--yellow);font-size:16px;letter-spacing:1px;}
.star-input{display:flex;gap:2px;flex-direction:row-reverse;justify-content:flex-end;}
.star-input button{
  background:none;border:none;font-size:22px;cursor:pointer;color:#bbb;padding:0 1px;transition:color .15s;
}
.star-input button.active,.star-input button:hover,.star-input button:hover~button{color:var(--yellow);}
.review-form-box{border:2px dashed var(--ink);border-radius:14px;padding:18px;margin-top:20px;}
.review-form-box textarea{width:100%;padding:10px;border-radius:10px;border:2px solid #ddd;font-family:'Plus Jakarta Sans';font-size:14px;resize:vertical;min-height:70px;background:var(--paper);color:var(--ink);}

footer.site{background:var(--ink);color:#D8D6F0;padding:48px 24px 28px;margin-top:40px;}
.footer-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.footer-brand{display:flex;align-items:center;gap:10px;}
.footer-note{font-size:13.5px;max-width:380px;line-height:1.6;}
.footer-ship{
  font-family:'Space Mono',monospace;font-size:12.5px;color:var(--yellow);margin-top:10px;
  display:inline-block;border:1px dashed var(--yellow);padding:6px 12px;border-radius:8px;
}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--paper);border-radius:20px;max-width:420px;width:100%;padding:30px 28px;position:relative;
  max-height:90vh;overflow-y:auto;
}
.modal-close{position:absolute;top:16px;right:16px;}
.tabs-toggle{display:flex;background:var(--paper-dim);border-radius:999px;padding:4px;margin-bottom:22px;}
.tabs-toggle button{
  flex:1;border:none;background:none;padding:10px;border-radius:999px;font-family:'Baloo 2';font-weight:700;font-size:14px;color:var(--ink);
}
.tabs-toggle button.is-active{background:var(--ink);color:var(--paper);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--ink-soft);}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:2px solid #ccc;font-family:'Plus Jakarta Sans';
  font-size:14.5px;background:var(--paper);color:var(--ink);transition:border .2s,background .25s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);outline:none;}
.form-error{
  background:#FFE9EB;color:var(--red-dark);font-size:13px;font-weight:600;padding:10px 12px;
  border-radius:10px;margin-bottom:14px;
}
.helper-note{font-size:12px;color:#999;margin-top:14px;text-align:center;}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:70;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--paper);z-index:75;
  display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,0.15);
}
.drawer-head{padding:22px 22px 16px;border-bottom:2px solid var(--paper-dim);display:flex;justify-content:space-between;align-items:center;}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px;}
.cart-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--paper-dim);}
.cart-row .ci{font-size:30px;}
.cart-row .ci-img{width:38px;height:38px;object-fit:cover;border-radius:9px;flex-shrink:0;}
.cart-row .cinfo{flex:1;}
.cart-row .cinfo h4{font-size:14.5px;font-family:'Baloo 2';}
.qty-stepper{display:flex;align-items:center;gap:8px;margin-top:6px;}
.qty-stepper button{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink);}
.qty-stepper span{font-family:'Space Mono';font-weight:700;min-width:18px;text-align:center;}
.remove-x{background:none;border:none;color:#999;font-size:18px;font-weight:700;}
.drawer-foot{padding:18px 22px 24px;border-top:2px solid var(--paper-dim);}
.subtotal-row{display:flex;justify-content:space-between;font-family:'Baloo 2';font-size:17px;margin-bottom:14px;}
.empty-cart{text-align:center;padding:50px 10px;color:#999;}
.empty-cart .e-icon{font-size:48px;margin-bottom:14px;}

.checkout-wrap{padding:50px 24px;max-width:980px;margin:0 auto;}
.checkout-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:26px;transition:background .25s;}
.summary-row{display:flex;justify-content:space-between;font-size:14.5px;padding:8px 0;border-bottom:1px solid var(--paper-dim);}
.summary-total{display:flex;justify-content:space-between;font-family:'Baloo 2';font-size:20px;margin-top:14px;}
.confirm-box{text-align:center;padding:70px 24px;max-width:520px;margin:0 auto;}
.confirm-box .big-check{font-size:64px;margin-bottom:18px;}
.order-code{display:inline-block;font-family:'Space Mono';font-weight:700;background:var(--paper-dim);padding:8px 18px;border-radius:10px;margin:14px 0;}

/* Webpay simulation */
.webpay-modal .modal{max-width:480px;text-align:center;}
.webpay-sim{padding:10px 0;}
.webpay-sim .wp-logo{font-size:48px;margin-bottom:10px;}
.webpay-sim .wp-bank-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--paper-dim);border-radius:10px;margin:8px 0;cursor:pointer;}
.webpay-sim .wp-bank-row.selected{border-color:var(--blue);background:color-mix(in srgb, var(--paper) 100%, var(--blue) 8%);}
.webpay-sim .wp-bank-row input[type=radio]{accent-color:var(--blue);}
.spinner{width:44px;height:44px;border:4px solid var(--paper-dim);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.account-wrap{padding:50px 24px;max-width:780px;margin:0 auto;}
.order-card{border:2px solid var(--paper-dim);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.order-card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.status-pill{font-family:'Space Mono';font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;}
.status-Pendiente{background:var(--yellow);color:var(--ink);}
.status-Preparando{background:var(--blue);}
.status-Enviado{background:var(--green);}
.status-Entregado{background:var(--ink);}
.status-Cancelado{background:var(--red);}

.admin-layout{display:flex;min-height:calc(100vh - 78px);}
.admin-sidebar{width:230px;background:var(--ink);color:var(--paper);padding:28px 16px;flex-shrink:0;}
.admin-sidebar h3{color:var(--yellow);font-size:13px;letter-spacing:1px;margin-bottom:18px;padding:0 10px;}
.admin-nav-link{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--paper);
  font-family:'Baloo 2';font-weight:700;font-size:15px;padding:12px 14px;border-radius:12px;margin-bottom:4px;
}
.admin-nav-link.is-active{background:var(--ink-soft);}
.admin-nav-link:hover{background:var(--ink-soft);}
.admin-main{flex:1;padding:34px 32px;background:var(--paper-dim);transition:background .25s;}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.data-table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:14px;overflow:hidden;}
.data-table th{
  text-align:left;background:var(--ink);color:var(--paper);font-family:'Space Mono';font-size:11.5px;
  text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;
}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--paper-dim);font-size:14px;vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.mini-icon{font-size:24px;}
.mini-image{width:34px;height:34px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.image-upload-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.image-preview{

/* ---------- DARK MODE ---------- */
function getTheme(){
  const stored = localStorage.getItem('dyg_theme');
  if(stored === 'dark' || stored === 'light') return stored;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  state.theme = t;
  localStorage.setItem('dyg_theme', t);
}

/* ---------- STORAGE ---------- */
async function safeGet(key, shared){
  try { const val = localStorage.getItem('dyg_' + key); if (val !== null) return { value: val }; return null; }
  catch(e) { return null; }
}
async function safeSet(key, value, shared){
  try { localStorage.setItem('dyg_' + key, JSON.stringify(value)); return true; }
  catch(e) { console.error("Error al guardar", key, e); return null; }
}
async function safeDelete(key, shared){
  try { localStorage.removeItem('dyg_' + key); return true; }
  catch(e) { return null; }
}
async function loadKey(key, shared, seedValue){
  const res = await safeGet(key, shared);
  if(res && res.value){
    try{ return JSON.parse(res.value); }catch(e){}
  }
  await safeSet(key, seedValue, shared);
  return seedValue;
}

async function loadAll(){
  applyTheme(getTheme());
  state.products = await loadKey("products", true, seedProducts());
  state.users = await loadKey("users", true, seedUsers());
  state.orders = await loadKey("orders", true, []);
  state.reviews = await loadKey("reviews", true, seedReviews());
  const sessionRes = await safeGet("session", false);
  if(sessionRes && sessionRes.value){
    try{ const sess = JSON.parse(sessionRes.value); state.currentUser = state.users.find(u => u.id === sess.userId) || null; }catch(e){}
  }
  state.loaded = true;
  render();
}
function saveProducts(){ return safeSet("products", state.products, true); }
function saveUsers(){ return safeSet("users", state.users, true); }
function saveOrders(){ return safeSet("orders", state.orders, true); }
function saveReviews(){ return safeSet("reviews", state.reviews, true); }
function saveSession(){
  if(state.currentUser) return safeSet("session", {userId: state.currentUser.id}, false);

}

/* ---------- AUTH ---------- */
function openAuth(tab){ state.authModal = tab || "login"; state.authError = ""; render(); }
function closeAuth(){ state.authModal = null; state.authError = ""; render(); }

async function handleLogin(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const email = (fd.get("email")||"").toString().trim().toLowerCase();
  const password = (fd.get("password")||"").toString();
  const user = state.users.find(u => u.email === email && u.password === password);
  if(!user){ state.authError = "Correo o contraseña incorrectos."; render(); return; }
  state.currentUser = user; state.authModal = null;
  await saveSession(); render();
  showToast(`¡Hola, ${user.name.split(" ")[0]}! 👋`);
}

async function handleRegister(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const name = (fd.get("name")||"").toString().trim();
  const email = (fd.get("email")||"").toString().trim().toLowerCase();
  const password = (fd.get("password")||"").toString();
  const confirmPw = (fd.get("confirm")||"").toString();
  if(name.length < 2){ state.authError = "Ingresa tu nombre completo."; render(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.authError = "Ingresa un correo válido."; render(); return; }
  if(password.length < 6){ state.authError = "La contraseña debe tener al menos 6 caracteres."; render(); return; }
  if(password !== confirmPw){ state.authError = "Las contraseñas no coinciden."; render(); return; }
  if(state.users.some(u => u.email === email)){ state.authError = "Ese correo ya está registrado."; render(); return; }
  const newUser = {id:"u"+Date.now(), name, email, password, role:"customer", createdAt:new Date().toISOString()};
  state.users.push(newUser); state.currentUser = newUser; state.authModal = null;
  await saveUsers(); await saveSession(); render();
  showToast(`¡Cuenta creada! Bienvenido/a, ${name.split(" ")[0]} 🎉`);
}

/* ---------- CART ---------- */
function addToCart(productId){
  if(!state.currentUser){ openAuth("login"); showToast("Inicia sesión para agregar productos 🔒"); return; }
  const product = state.products.find(p => p.id === productId);
  if(!product || product.stock <= 0) return;
  const existing = state.cart.find(c => c.productId === productId);
  const currentQty = existing ? existing.qty : 0;
  if(currentQty >= product.stock){ showToast("No hay más stock disponible."); return; }
  if(existing) existing.qty++; else state.cart.push({productId, qty:1});
  render(); showToast(`${product.name} agregado al carrito 🧸`);
}
function changeQty(productId, delta){
  const item = state.cart.find(c => c.productId === productId);
  if(!item) return;
  const product = state.products.find(p => p.id === productId);
  item.qty += delta;
  if(item.qty > product.stock) item.qty = product.stock;
  if(item.qty <= 0) state.cart = state.cart.filter(c => c.productId !== productId);
  render();
}
function removeFromCart(productId){ state.cart = state.cart.filter(c => c.productId !== productId); render(); }
function cartTotal(){ return state.cart.reduce((sum, c) => { const p = state.products.find(p => p.id === c.productId); return sum + (p ? p.price * c.qty : 0); }, 0); }
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }
function toggleCart(){ state.cartOpen = !state.cartOpen; render(); }

/* ---------- EMAIL NOTIFICATIONS ---------- */
async function sendEmailNotification(order, type){
  if(EMAILJS_CONFIG.PUBLIC_KEY === "YOUR_PUBLIC_KEY") return;
  let subject, message;
  if(type === 'new'){
    subject = `🛒 Nuevo pedido ${order.id} — ${order.userName}`;
    message = `Cliente: ${order.userName} (${order.userEmail})\nTotal: ${formatCLP(order.total)}\nDestino: ${order.shipping.comuna}, ${order.shipping.region}\nMétodo de pago: ${order.shipping.metodoPago}`;
  } else {
    subject = `📦 Pedido ${order.id} — ${order.status}`;
    message = `El pedido ${order.id} de ${order.userName} cambió a: ${order.status}`;
  }
  try {
    await emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, {
      to_email: EMAILJS_CONFIG.ADMIN_EMAIL,
      subject, message,
      order_id: order.id,
      customer_name: order.userName,
      order_total: formatCLP(order.total),
      order_status: order.status
    });
  } catch(e) { console.warn("EmailJS error (configurable en EmailJS):", e); }
}

let pendingCheckoutData = null;

async function finalizeCheckout(){
  const d = pendingCheckoutData;
  if(!d) return;
  const {nombre, direccion, comuna, region, telefono, metodoPago, items, total} = d;
  const orderNumber = "DYG-" + String(state.orders.length + 1).padStart(4,"0");
  const order = {
    id: orderNumber, userId: state.currentUser.id,
    userName: state.currentUser.name, userEmail: state.currentUser.email,
    items, total,
    shipping: {nombre, direccion, comuna, region, telefono, metodoPago},
    status: "Pendiente",
    createdAt: new Date().toISOString()
  };
  items.forEach(it => {
    const p = state.products.find(p => p.id === it.productId);
    if(p) p.stock = Math.max(0, p.stock - it.qty);
  });
  state.orders.push(order);
  state.cart = [];
  state.lastOrder = order;
  state.view = "confirmation";
  pendingCheckoutData = null;
  await saveOrders();
  await saveProducts();
  sendEmailNotification(order, 'new');
  render();
}

function handleCheckoutSubmit(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const nombre = (fd.get("nombre")||"").toString().trim();
  const direccion = (fd.get("direccion")||"").toString().trim();
  const comuna = (fd.get("comuna")||"").toString().trim();
  const region = (fd.get("region")||"").toString();
  const telefono = (fd.get("telefono")||"").toString().trim();
  const metodoPago = (fd.get("metodoPago")||"").toString();
  if(!nombre || !direccion || !comuna || !region || !telefono) return;

  const items = state.cart.map(c => {
    const p = state.products.find(p => p.id === c.productId);
    return {productId:p.id, name:p.name, icon:p.icon, images:p.images||[], price:p.price, qty:c.qty};
  });
  const total = cartTotal();
  pendingCheckoutData = {nombre, direccion, comuna, region, telefono, metodoPago, items, total};

  if(metodoPago === "Webpay (tarjeta crédito/débito)"){
    startWebpayFlow();
  } else {
    finalizeCheckout();
  }
}

/* ---------- CAROUSEL ---------- */
function carouselInit(productId){
  if(!state.carouselIdx[productId]) state.carouselIdx[productId] = 0;
}
function carouselPrev(productId, len){
  carouselInit(productId);
  state.carouselIdx[productId] = (state.carouselIdx[productId] - 1 + len) % len;
  render();
}
function carouselNext(productId, len){
  carouselInit(productId);
  state.carouselIdx[productId] = (state.carouselIdx[productId] + 1) % len;
  render();
}
function carouselGo(productId, idx){
  state.carouselIdx[productId] = idx;
  render();
}
function renderCarousel(p, height){
  const imgs = p.images && p.images.length > 0 ? p.images : [];
  if(imgs.length === 0){
    return `<div class="tag-icon">${p.icon}</div>`;
  }
  carouselInit(p.id);
  const idx = state.carouselIdx[p.id] || 0;
  return `
  <div class="carousel">
    <div class="carousel-track" style="transform:translateX(-${idx*100}%)">
      ${imgs.map(url => `<div class="carousel-slide"><img src="${url}" alt="${escapeHtml(p.name)}" loading="lazy"></div>`).join('')}
    </div>
    ${imgs.length > 1 ? `
    <button class="carousel-btn prev" onclick="event.stopPropagation();carouselPrev('${p.id}',${imgs.length})" aria-label="Anterior">‹</button>
    <button class="carousel-btn next" onclick="event.stopPropagation();carouselNext('${p.id}',${imgs.length})" aria-label="Siguiente">›</button>` : ''}
  </div>
  ${imgs.length > 1 ? `
  <div class="carousel-dots">
    ${imgs.map((_,i) => `<button class="carousel-dot ${i===idx?'active':''}" onclick="event.stopPropagation();carouselGo('${p.id}',${i})" aria-label="Imagen ${i+1}"></button>`).join('')}
  </div>` : ''}`;
}

/* ---------- ADMIN: IMÁGENES ---------- */
function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 360; quality = quality || 0.74;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("El archivo no es una imagen válida."));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function captureProductFormFields(){
  const form = document.getElementById("product-form");
  if(!form || !state.productModal) return;
  const fd = new FormData(form);
  state.productModal.name = (fd.get("name") || "").toString();
  state.productModal.category = (fd.get("category") || "").toString();
  state.productModal.icon = (fd.get("icon") || "").toString();
  state.productModal.price = (fd.get("price") || "").toString();
  state.productModal.stock = (fd.get("stock") || "").toString();
  state.productModal.desc = (fd.get("desc") || "").toString();
}
async function handleImagesUpload(ev){
  const files = Array.from(ev.target.files || []);
  if(files.length === 0) return;
  const valid = files.filter(f => f.type.startsWith("image/") && f.size <= 10*1024*1024);
  if(valid.length === 0){ showToast("Selecciona imágenes válidas (máx 10MB c/u)."); return; }
  captureProductFormFields();
  try {
    const results = await Promise.all(valid.map(f => resizeImageFile(f)));
    state.productModal.images = [...(state.productModal.images||[]), ...results];
    render();
  } catch(e) { showToast("Error al procesar imágenes."); }
}
function removeProductImageAt(idx){
  captureProductFormFields();
  state.productModal.images = (state.productModal.images||[]).filter((_,i) => i !== idx);
  render();
}
function itemThumbInline(it){
  if(it.images && it.images.length > 0) return `<img src="${it.images[0]}" alt="" style="width:18px;height:18px;object-fit:cover;border-radius:5px;vertical-align:-3px;margin-right:3px;">`;
  return (it.icon || "🧸") + " ";
}
function productMediaTag(p, size){
  if(p.images && p.images.length > 0) return `<img src="${p.images[0]}" alt="${escapeHtml(p.name||"")}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:9px;flex-shrink:0;">`;
  return `<span style="font-size:${Math.round(size*0.78)}px;display:inline-block;">${p.icon || "🧸"}</span>`;
}

function openProductModal(productId){

    const p = state.products.find(p => p.id === productId);

  } else {

  }

async function handleProductFormSubmit(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const name = (fd.get("name")||"").toString().trim();
  const category = (fd.get("category")||"").toString();
  const icon = (fd.get("icon")||"🧸").toString().trim() || "🧸";
  const price = parseInt(fd.get("price"),10) || 0;
  const stock = parseInt(fd.get("stock"),10) || 0;
  const desc = (fd.get("desc")||"").toString().trim();
  const images = state.productModal.images || [];
  if(!name || price <= 0) return;
  if(state.productModal.isNew){
    state.products.push({id:"p"+Date.now(), name, category, icon, price, stock, desc, images});
    showToast("Producto creado ✅");
  } else {
    const p = state.products.find(p => p.id === state.productModal.id);
    Object.assign(p, {name, category, icon, price, stock, desc, images});
    showToast("Producto actualizado ✅");
  }
  state.productModal = null;
  await saveProducts(); render();
}

async function confirmDeleteProduct(id){

  return `
  <div class="checkout-wrap">
    <div class="confirm-box panel">
      <div class="big-check">🎉</div>
      <h2 style="font-size:26px;">¡Pedido confirmado!</h2>
      <p style="margin-top:10px;color:var(--ink-soft);">Gracias por tu compra, ${escapeHtml(o.userName.split(" ")[0])}.</p>
      <div class="order-code mono">${o.id}</div>
      <p style="font-size:14px;color:var(--ink-soft);">${o.shipping.metodoPago === "Webpay (tarjeta crédito/débito)" ? '💳 Pago vía Webpay procesado correctamente.<br>' : ''}Será enviado a ${escapeHtml(o.shipping.comuna)}, ${escapeHtml(o.shipping.region)}.<br>Recuerda: hacemos envíos solo dentro de Chile 🇨🇱</p>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-red" onclick="goStore()">Volver a la tienda</button>
        <button class="btn btn-ghost" onclick="goAccount()">Ver mis pedidos</button>
      </div>
    </div>
  </div>`;
}

function renderAccount(){
  const myOrders = state.orders.filter(o => o.userId === state.currentUser.id).slice().reverse();
  return `
  <div class="account-wrap">
    <h2 style="font-size:28px;margin-bottom:6px;">Mis pedidos</h2>
    <p style="color:var(--ink-soft);margin-bottom:26px;">Hola ${escapeHtml(state.currentUser.name.split(" ")[0])}, aquí puedes revisar el estado de tus compras.</p>
    ${myOrders.length === 0 ? `
    <div class="empty-state">Todavía no tienes pedidos. ¡Anda a ver el catálogo! 🧸</div>` :
    myOrders.map(o => `
    <div class="order-card">
      <div class="order-card-head">
        <strong class="mono">${o.id}</strong>
        <span class="status-pill status-${o.status}">${o.status}</span>
      </div>
      <p style="font-size:13px;color:var(--ink-soft);margin:8px 0;">${formatDate(o.createdAt)} · Envío a ${escapeHtml(o.shipping.comuna)}, ${escapeHtml(o.shipping.region)} · ${escapeHtml(o.shipping.metodoPago)}</p>
      <p style="font-size:13.5px;">${o.items.map(it => `${itemThumbInline(it)}${escapeHtml(it.name)} ×${it.qty}`).join(" · ")}</p>
      <p class="mono" style="margin-top:8px;font-weight:700;">${formatCLP(o.total)}</p>
    </div>`).join("")}
  </div>`;
}

/* ---------- ADMIN ---------- */
function renderAdmin(){
  return `
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h3>PANEL ADMIN</h3>
      <button class="admin-nav-link ${state.adminTab==='productos'?'is-active':''}" onclick="goAdmin('productos')">📦 Productos</button>
      <button class="admin-nav-link ${state.adminTab==='pedidos'?'is-active':''}" onclick="goAdmin('pedidos')">🧾 Pedidos</button>
      <button class="admin-nav-link ${state.adminTab==='usuarios'?'is-active':''}" onclick="goAdmin('usuarios')">👥 Usuarios</button>
      <button class="admin-nav-link" onclick="goStore()">↩️ Volver a la tienda</button>
    </aside>
    <main class="admin-main">
      ${state.adminTab === 'productos' ? renderAdminProductos() : ''}
      ${state.adminTab === 'pedidos' ? renderAdminPedidos() : ''}
      ${state.adminTab === 'usuarios' ? renderAdminUsuarios() : ''}
    </main>
  </div>`;
}

function renderAdminProductos(){
  const totalStock = state.products.reduce((s,p)=>s+p.stock,0);
  const lowStock = state.products.filter(p=>p.stock>0 && p.stock<=5).length;
  return `
  <div class="admin-head">
    <h2 style="font-size:24px;">Productos</h2>
    <button class="btn btn-red btn-sm" onclick="openProductModal()">+ Nuevo producto</button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="num mono">${state.products.length}</div><div class="lbl">Productos totales</div></div>
    <div class="stat-card"><div class="num mono">${totalStock}</div><div class="lbl">Unidades en stock</div></div>
    <div class="stat-card"><div class="num mono">${lowStock}</div><div class="lbl">Con stock bajo (≤5)</div></div>
  </div>
  <div class="admin-card-table">
    <table class="data-table">
      <thead><tr><th></th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Imágenes</th><th></th></tr></thead>
      <tbody>
        ${state.products.map(p => `
        <tr>
          <td>${p.images && p.images[0] ? `<img class="mini-image" src="${p.images[0]}" alt="">` : `<span class="mini-icon">${p.icon}</span>`}</td>
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.category)}</td>
          <td class="mono">${formatCLP(p.price)}</td>
          <td class="mono">${p.stock}</td>
          <td>${(p.images||[]).length}</td>
          <td>
            ${state.deleteConfirmId === p.id ? `
            <div class="confirm-inline">
              ¿Eliminar?
              <button class="icon-action" onclick="confirmDeleteProduct('${p.id}')">Sí</button>
              <button class="icon-action" onclick="cancelDelete()">No</button>
            </div>` : `
            <div class="table-actions">
              <button class="icon-action" aria-label="Editar" onclick="openProductModal('${p.id}')">✏️</button>
              <button class="icon-action" aria-label="Eliminar" onclick="askDeleteProduct('${p.id}')">🗑️</button>
            </div>`}
          </td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function renderAdminPedidos(){
  const orders = state.orders.slice().reverse();
  return `
  <div class="admin-head"><h2 style="font-size:24px;">Pedidos</h2></div>
  ${orders.length === 0 ? `<div class="empty-state">Todavía no hay pedidos registrados.</div>` : `
  <div class="admin-card-table">
    <table class="data-table">
      <thead><tr><th>Pedido</th><th>Cliente</th><th>Fecha</th><th>Destino</th><th>Pago</th><th>Total</th><th>Estado</th></tr></thead>
      <tbody>
        ${orders.map(o => `
        <tr>
          <td class="mono">${o.id}</td>
          <td>${escapeHtml(o.userName)}<br><span style="color:#999;font-size:12px;">${escapeHtml(o.userEmail)}</span></td>
          <td>${formatDate(o.createdAt)}</td>
          <td>${escapeHtml(o.shipping.comuna)}, ${escapeHtml(o.shipping.region)}</td>
          <td style="font-size:12px;">${escapeHtml(o.shipping.metodoPago)}</td>
          <td class="mono">${formatCLP(o.total)}</td>
          <td>
            <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
              ${ESTADOS.map(s => `<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join("")}
            </select>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`}`;
}

function renderAdminUsuarios(){
  const customers = state.users.filter(u => u.role === "customer");
  return `
  <div class="admin-head"><h2 style="font-size:24px;">Usuarios registrados</h2></div>
  ${customers.length === 0 ? `<div class="empty-state">Aún no hay clientes registrados.</div>` : `
  <div class="admin-card-table">
    <table class="data-table">
      <thead><tr><th>Nombre</th><th>Correo</th><th>Registrado</th><th>Pedidos</th></tr></thead>
      <tbody>
        ${customers.map(u => `
        <tr>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td>${formatDate(u.createdAt)}</td>
          <td class="mono">${state.orders.filter(o=>o.userId===u.id).length}</td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`}`;
}

function renderProductModal(){
  const p = state.productModal;
  const images = p.images || [];
  return `
  <div class="overlay" onclick="if(event.target===this) closeProductModal()">
    <div class="modal">
      <button class="icon-btn modal-close" aria-label="Cerrar" onclick="closeProductModal()">✕</button>
      <h3 style="font-size:20px;margin-bottom:18px;">${p.isNew ? "Nuevo producto" : "Editar producto"}</h3>
      <form id="product-form" onsubmit="handleProductFormSubmit(event)">
        <div class="field"><label>Nombre</label><input type="text" name="name" required value="${escapeHtml(p.name)}"></div>
        <div class="field">
          <label>Categoría</label>
          <select name="category">
            <option value="Muñecas y figuras de acción" ${p.category==="Muñecas y figuras de acción"?"selected":""}>Muñecas y figuras de acción</option>
            <option value="Juegos de mesa" ${p.category==="Juegos de mesa"?"selected":""}>Juegos de mesa</option>
          </select>
        </div>
        <div class="field">
          <label>Fotos del producto (carrusel)</label>
          <div class="image-upload-row">
            ${images.length > 0 ? `<div class="image-list">${images.map((url,i) => `
              <div class="image-list-item">
                <img src="${url}" alt="">
                <button type="button" class="remove-img-btn" onclick="removeProductImageAt(${i})">✕</button>
              </div>`).join('')}</div>` : `<div class="image-preview"><span class="image-preview-empty">${escapeHtml(p.icon||"🧸")}</span></div>`}
            <div class="image-upload-actions">
              <input type="file" accept="image/*" multiple onchange="handleImagesUpload(event)">
              <span style="font-size:11px;color:#999;">Sube una o varias fotos (se mostrarán como carrusel)</span>
            </div>
          </div>
        </div>
        <div class="field"><label>Ícono de respaldo (emoji)</label><input type="text" name="icon" value="${escapeHtml(p.icon||"")}" maxlength="4"></div>
        <div class="field"><label>Precio (CLP)</label><input type="number" name="price" min="1" required value="${p.price}"></div>
        <div class="field"><label>Stock</label><input type="number" name="stock" min="0" required value="${p.stock}"></div>
        <div class="field"><label>Descripción</label><textarea name="desc" rows="3">${escapeHtml(p.desc||"")}</textarea></div>
        <button type="submit" class="btn btn-red" style="width:100%;">${p.isNew ? "Crear producto" : "Guardar cambios"}</button>
      </form>
    </div>
  </div>`;
}

document.addEventListener("click", (e) => {
  if(state.accountMenuOpen && !e.target.closest(".account-menu")){ state.accountMenuOpen = false; render(); }
});

loadAll();
</script>
</body>
</html>
